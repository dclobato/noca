[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
packages = ["."]

[tool.hatch.version]
source = "regex"
path = "../pyproject.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[project]
name = "noca-healthmonitor"
dynamic = ["version"]
description = "NOCA health monitor: public live status and uptime dashboard for all runtime modules."
authors = [
    { name = "Daniel Correa Lobato", email = "daniel@lobato.org" }
]
requires-python = ">=3.14"
dependencies = [
    "noca-shared",
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "python-dotenv==1.2.2",
    "uvicorn==0.49.0",
]

[project.scripts]
noca-healthmonitor = "healthmonitor.main:main"
