# Deliberately the last AGP 8.x rather than the newest 9.x: the app is small and
# boring, and a conservative, well-understood plugin line costs nothing here
# while removing a whole class of first-build surprises.
#
# That choice constrains the AndroidX versions, and the constraint is checkable
# rather than a matter of taste: every AAR embeds
# META-INF/com/android/build/gradle/aar-metadata.properties declaring its
# `minCompileSdk` and `minAndroidGradlePluginVersion`, and AGP fails the build
# when a dependency asks for more than the project provides. With
# `compileSdk = 36` and AGP 8.13.2:
#
#   * androidx.core 1.19.0 demands compileSdk 37 + AGP 9.1.0  -> 1.18.0 is the
#     newest usable release (compileSdk 36, AGP 8.9.1).
#   * androidx.lifecycle 2.11.0 demands the same  -> 2.10.0 is the newest usable
#     release (compileSdk 35, AGP 8.6.0).
#
# The pins hold transitively: activity-compose 1.13.0 asks for core-ktx 1.18.0
# and lifecycle 2.9.4, and Compose UI 1.11.4 asks for lifecycle-runtime-compose
# 2.8.7, so nothing in the graph raises either past its cap. Compose BOM
# 2026.06.01 (UI 1.11.4, Material3 1.4.0) needs only compileSdk 35 / AGP 8.6.0
# and is unaffected.
#
# Moving to AGP 9.x + compileSdk 37 would lift both caps, but that is a
# deliberate upgrade to make once this build is known good -- not a fix to apply
# blind.

[versions]
agp = "8.13.2"
kotlin = "2.3.21"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
composeBom = "2026.06.01"
datastore = "1.2.1"
okhttp = "5.4.0"
serialization = "1.11.0"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Versions come from the Compose BOM below.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-sse = { group = "com.squareup.okhttp3", name = "okhttp-sse", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
