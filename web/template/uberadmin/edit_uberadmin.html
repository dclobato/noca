{% extends "_base.html" %}
{% block title_suffix %}— Edit UberAdmin{% endblock %}
{% block content %}
    <div class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Edit UberAdmin</h1>
                <p class="text-muted mb-0">
                    <code>{{ edit_ua.username }}</code>
                </p>
            </div>
            <a href="{{ request.url_for("list_uberadmins_route") }}"
               class="btn btn-outline-secondary btn-sm">Back to list</a>
        </div>
        <div class="row">
            <div class="col-12 col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        {% if error %}<div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>{% endif %}
                        <form method="post"
                              action="{{ request.url_for('edit_uberadmin_submit', uberadmin_id=edit_ua.id) }}"
                              novalidate>
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <p class="form-control-plaintext mb-0">
                                    <code>{{ edit_ua.username }}</code>
                                </p>
                            </div>
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Full name</label>
                                <input type="text"
                                       class="form-control"
                                       id="fullname"
                                       name="fullname"
                                       value="{{ edit_ua.fullname }}"
                                       autocomplete="name"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email"
                                       class="form-control"
                                       id="email"
                                       name="email"
                                       value="{{ edit_ua.email_normalizado }}"
                                       autocomplete="email"
                                       required>
                            </div>
                            <div class="mb-4">
                                <label for="new_password" class="form-label">
                                    New password <span class="text-muted small">(leave blank to keep current)</span>
                                </label>
                                <input type="text"
                                       class="form-control"
                                       id="new_password"
                                       name="new_password"
                                       value=""
                                       autocomplete="new-password">
                                <div class="form-text">Leave blank to keep current password.</div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm">Save changes</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
