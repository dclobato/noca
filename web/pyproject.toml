[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
packages = ["."]

[tool.hatch.version]
source = "regex"
path = "../pyproject.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[project]
name = "noca-web"
dynamic = ["version"]
description = "NOCA web application: contest admin, problem management, scoreboard, and submission lifecycle."
authors = [
    { name = "Daniel Correa Lobato", email = "daniel@lobato.org" }
]
requires-python = ">=3.14"
dependencies = [
    "noca-shared",
    "deterministic-avatar @ git+https://github.com/dclobato/deterministic-avatar.git@v1.1.1",
    "fastapi==0.136.3",
    "fastapi_flash @ git+https://github.com/dclobato/fastapi_flash.git@v0.1.0",
    "jinja2==3.1.6",
    "jwtservice @ git+https://github.com/dclobato/jwtservice.git@v2.1.0",
    "markdown_sanitize @ git+https://github.com/dclobato/markdown_sanitize.git@v2.0.0",
    "tabulate==0.10.0",
    "python-multipart==0.0.32",
    "uvicorn==0.49.0",
    "werkzeug==3.1.8",
]

[project.scripts]
noca-web = "web.main:main"
