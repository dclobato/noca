[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
packages = ["."]

[tool.hatch.version]
source = "regex"
path = "../pyproject.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[project]
name = "noca-autojudge"
dynamic = ["version"]
description = "NOCA autojudge worker: sandboxed compilation and execution of submissions."
authors = [
    { name = "Daniel Correa Lobato", email = "daniel@lobato.org" }
]
requires-python = ">=3.14"
dependencies = [
    "noca-shared",
    "docker==7.1.0",
    "prometheus-client==0.25.0",
]

[project.scripts]
noca-autojudge = "autojudge.worker:main"
