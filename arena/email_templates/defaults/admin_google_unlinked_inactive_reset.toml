subject = "Your linked Google account was removed"
body = """
Hello {nome},

An administrator of {brand_name} unlinked the Google account from your {brand_name} account. Signing in with Google is no longer possible for this account, and your existing sessions were signed out.

This account has no password yet. To sign in with a password, set one first: use "Forgot password?" on the login page, or open the link below, and a password-reset email will be sent to this address:

{password_reset_url}

This account is currently deactivated, and setting a password does not reactivate it. Signing in is not possible until an administrator of {brand_name} reactivates it.

If you did not expect this change, contact an administrator of {brand_name}.
"""
