[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
packages = ["."]

[tool.hatch.version]
source = "regex"
path = "../pyproject.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[project]
name = "noca-arena"
dynamic = ["version"]
description = "NOCA Arena: public-facing competitive-programming hub with its own user identity domain."
authors = [
    { name = "Daniel Correa Lobato", email = "daniel@lobato.org" }
]
requires-python = ">=3.14"
dependencies = [
    "noca-shared",
    "deterministic-avatar @ git+https://github.com/dclobato/deterministic-avatar.git@v1.1.1",
    "fastapi==0.136.3",
    "fastapi_flash @ git+https://github.com/dclobato/fastapi_flash.git@v0.1.0",
    "jinja2==3.1.6",
    "jwtservice @ git+https://github.com/dclobato/jwtservice.git@v2.1.0",
    "pycountry==26.2.16",
    "pyotp==2.9.0",
    "pytz==2026.2",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "qrcode==8.2",
    "relative-datetime==0.1.4",
    "uvicorn==0.49.0",
    "werkzeug==3.1.8",
]

[project.scripts]
noca-arena = "arena.main:main"
