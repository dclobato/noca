[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
dev-mode-dirs = [".."]
packages = ["."]

[tool.hatch.version]
source = "regex"
path = "../pyproject.toml"
pattern = '(?m)^version = "(?P<version>[^"]+)"'

[project]
name = "noca-animator"
dynamic = ["version"]
description = "NOCA animator: standalone live scoreboard and reveal presentation runtime."
authors = [
    { name = "Daniel Correa Lobato", email = "daniel@lobato.org" }
]
requires-python = ">=3.14"
dependencies = [
    "noca-shared",
    "asyncpg==0.31.0",
    "fastapi==0.136.3",
    "jinja2==3.1.6",
    "puremagic==2.2.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "sqlalchemy[asyncio]==2.0.50",
    "uvicorn==0.49.0",
]

[project.scripts]
noca-animator = "animator.main:main"
